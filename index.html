<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Thông Tin Cá Nhân</title>
    <!-- Nhúng thư viện Supabase JS siêu nhẹ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        h2 { text-align: center; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background-color: #fff; }
        th, td { border: 1px solid #000; padding: 10px; text-align: center; }
        th { background-color: #c3d69b; font-weight: bold; }
        .search-table { margin-bottom: 20px; width: 100%; }
        .search-table td { border: 1px solid #000; padding: 8px; text-align: left; }
        .search-table .label-cell { background-color: #e6e6a8; font-weight: bold; width: 150px; }
        .search-table input { width: 100%; padding: 5px; border: none; outline: none; font-size: 16px; }
        #loading { text-align: center; font-weight: bold; color: green; display: none; margin: 10px 0; }
    </style>
</head>
<body>

    <h2>TRA CỨU THÔNG TIN CÁ NHÂN</h2>

    <table class="search-table">
        <tr>
            <td class="label-cell">NHẬP CCCD</td>
            <td><input type="text" id="input-cccd" placeholder="Nhập số CCCD" onkeypress="handleKeyPress(event)"></td>
        </tr>
        <tr>
            <td class="label-cell">NHẬP MÃ CÁ NHÂN</td>
            <td>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="input-macanhan" placeholder="Nhập mã cá nhân" onkeypress="handleKeyPress(event)" style="width: 100%; padding-right: 35px; box-sizing: border-box;">
                    <span id="togglePassword" onclick="toggleVisibility()" style="position: absolute; right: 10px; cursor: pointer; font-size: 18px;" title="Hiện/Ẩn mã cá nhân">👁️</span>
                </div>
            </td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center; background-color: #fff; padding: 10px;">
                <button onclick="search()" style="padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #c3d69b; border: 1px solid #000; cursor: pointer;">TRA CỨU</button>
            </td>
        </tr>
    </table>

    <div id="loading">Đang kết nối cơ sở dữ liệu...</div>

    <table id="data-table">
        <thead>
            <tr>
                <th>Số CCCD</th>
                <th>Họ và Tên</th>
                <th>Số điện thoại</th>
                <th>Ngày Cấp/ Nơi Cấp CCCD</th>
                <th>SĐT dự phòng</th>
                <th>Địa chỉ liên hệ</th>
                <th>Mật mã cá nhân</th>
                <th>Số tài khoản</th>
                <th>Tên Ngân hàng</th>
                <th>Chủ tài khoản</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="result-body">
        </tbody>
    </table>

    <script>
        // ⚠️ THAY THÔNG TIN SUPABASE CỦA BẠN VÀO ĐÂY:
        const SUPABASE_URL = "https://uwkujekiqtncgcryitih.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3a3VqZWtpcXRuY2djcnlpdGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjg2NTIsImV4cCI6MjEwNzY0NDY1Mn0.h9cIVAZnrD1jZun3M51_v2jRoJvEpFbwsoyzva_MkoU";

        // Khởi tạo kết nối Supabase
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleVisibility() {
            const input = document.getElementById('input-macanhan');
            const icon = document.getElementById('togglePassword');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                search();
            }
        }

        async function search() {
            const cccd = document.getElementById('input-cccd').value.trim();
            const macanhan = document.getElementById('input-macanhan').value.trim();
            const tbody = document.getElementById('result-body');
            const loading = document.getElementById('loading');
            
            tbody.innerHTML = '';

            if (cccd === '' || macanhan === '') {
                alert("Vui lòng nhập đầy đủ CCCD và Mã cá nhân!");
                return;
            }

            loading.style.display = 'block';

            try {
                // Gọi hàm tìm kiếm siêu tốc trực tiếp trên PostgreSQL
                const { data, error } = await _supabase.rpc('tra_cuu_thong_tin', {
                    p_cccd: cccd,
                    p_macanhan: macanhan
                });

                loading.style.display = 'none';

                if (error) {
                    console.error("Lỗi truy vấn:", error);
                    alert("Có lỗi xảy ra khi truy vấn dữ liệu!");
                    return;
                }

                if (data && data.length > 0) {
                    data.forEach(item => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${item.cccd || ''}</td>
                            <td>${item.hoten || ''}</td>
                            <td>${item.sdt || ''}</td>
                            <td>${item.ngaycap || ''}</td>
                            <td>${item.sdt_duphong || ''}</td>
                            <td>${item.diachi || ''}</td>
                            <td>${item.macanhan || ''}</td>
                            <td>${item.stk || ''}</td>
                            <td>${item.nganhang || ''}</td>
                            <td>${item.chutk || ''}</td>
                            <td>${item.email || ''}</td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    alert("Xin lỗi, không tìm thấy thông tin vui lòng kiểm tra lại CCCD hoặc Mã cá nhân");
                }
            } catch (err) {
                loading.style.display = 'none';
                alert("Không thể kết nối đến cơ sở dữ liệu!");
                console.error(err);
            }
        }
    </script>
</body>
</html>
